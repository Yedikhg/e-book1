services:
  - type: web
    name: elevage-demo-api
    runtime: go
    repo: https://github.com/Yedikhg/e-book1
    branch: claude/gallant-goodall-yrld3u
    rootDir: elevage-app/backend
    region: frankfurt
    plan: free
    buildCommand: mkdir -p bin && go build -o bin/migrate ./cmd/migrate && go build -o bin/api ./cmd/api/main.go
    startCommand: ./bin/migrate && ./bin/api
    healthCheckPath: /api/sante
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elevage-demo-db
          property: connectionString
